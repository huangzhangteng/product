<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>变量自动生成 (精细线框)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #e2e8f0;
    height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #000;
  }
  
  /* 弹窗外部容器 */
  .modal {
    width: 600px; height: 85vh; min-height: 600px; max-height: 900px;
    background: #fff;
    border: 2px solid #000;
    box-shadow: 12px 12px 0 rgba(0,0,0,0.05); /* 干净的纯色块阴影或淡色块阴影 */
    display: flex; flex-direction: column;
    border-radius: 8px;
    overflow: hidden;
  }

  /* 标题栏 */
  .header {
    padding: 16px 24px;
    border-bottom: 2px solid #000;
    display: flex; justify-content: space-between; align-items: center;
    background: #fff;
  }
  .header-title { font-weight: bold; font-size: 16px; }
  .header-close { font-weight: bold; font-size: 20px; cursor: pointer; color: #666; }
  
  /* 会话区 */
  .chat-body { 
    flex: 1; padding: 24px; overflow-y: auto; background: #fafafa;
  }
  .chat-body::-webkit-scrollbar { width: 6px; }
  .chat-body::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  
  .msg { display: flex; width: 100%; margin-bottom: 24px; flex-direction: column; animation: fadeIn 0.3s; }
  
  /* 不使用头像，通过对齐和气泡颜色区分 */
  .msg.user { align-items: flex-end; }
  .msg.ai { align-items: flex-start; }
  
  .bubble {
    max-width: 85%;
    padding: 14px 18px;
    font-size: 14px; line-height: 1.6;
    border-radius: 8px;
  }
  /* 用户：深灰底白字，直角在右下 */
  .msg.user .bubble { 
    background: #222; color: #fff; 
    border-bottom-right-radius: 0; 
  }
  /* AI：白底黑边框黑字，直角在左下 */
  .msg.ai .bubble { 
    background: #fff; color: #000; border: 2px solid #000; 
    border-bottom-left-radius: 0; 
  }
  
  /* AI 气泡内部复杂组件 */
  .ai-files-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .ai-file-tag {
    border: 2px solid #000; padding: 6px 10px; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 4px;
  }
  .ai-file-tag-icon {
    display: inline-block; width: 12px; height: 12px; background: #10b981; border: 1px solid #000;
  }
  
  /* 占位框 (相当于原型上的 X 划线框) */
  .placeholder-box {
    border: 2px dashed #999;
    padding: 30px; text-align: center;
    background: #f5f5f5; margin: 12px 0; border-radius: 4px;
    position: relative;
  }
  .placeholder-title { font-weight: bold; font-size: 14px; color: #666; margin-bottom: 16px; }
  
  .progress-wrap { margin-top: 16px; width: 100%; }
  .progress-bar { 
    width: 100%; height: 10px; background: #fff; border-radius: 6px; overflow: hidden; border: 2px solid #000;
  }
  .progress-fill { height: 100%; background: #000; width: 0%; transition: width 0.3s linear; }
  .progress-label { font-size: 12px; font-weight: bold; margin-top: 8px; text-align: left;}
  
  /* 列表与文字块 */
  .ai-desc-block { margin-bottom: 16px; }
  .ai-desc-block span { font-weight: bold; }
  
  .channel-row {
    border: 2px solid #000; padding: 12px 16px; margin-bottom: 8px;
    font-size: 13px; font-weight: 600; display: flex; gap: 16px; background: #fff;
    border-radius: 4px; align-items: center;
  }
  .channel-name { flex: 1; }
  
  .btn {
    padding: 10px 20px; border: 2px solid #000; background: #fff; cursor: pointer;
    font-weight: bold; font-size: 13px; border-radius: 4px; transition: background 0.15s;
    float: right; margin-top: 8px;
  }
  .btn:hover { background: #f0f0f0; }
  .btn:disabled { color: #999; border-color: #ccc; cursor: not-allowed; }

  /* 底部固定输入区 */
  .footer { padding: 16px 24px 24px; border-top: 2px solid #000; background: #fff; }
  .hints { font-size: 12px; color: #666; margin-bottom: 10px; }
  
  .input-files { display: flex; gap: 10px; margin-bottom: 10px; }
  .input-file-tag {
    border: 2px solid #000; padding: 6px 10px; font-size: 12px; font-weight: 600;
    display: flex; gap: 8px; align-items: center; border-radius: 4px; background: #fafafa;
  }
  .input-file-tag i { font-style: normal; cursor: pointer; color: #999; }
  .input-file-tag i:hover { color: #000; }
  
  .input-wrap { 
    display: flex; gap: 12px; align-items: stretch; 
    border: 2px solid #000; border-radius: 6px; padding: 4px 8px; background: #fff;
    transition: background 0.2s;
  }
  .input-wrap.locked { background: #f0f0f0; border-color: #999; }
  
  .input-box-control {
    flex: 1; border: none; outline: none; font-size: 14px; padding: 8px;
    background: transparent;
  }
  .input-wrap.locked .input-box-control { color: #999; }
  
  .tool-btn {
    width: 36px; height: 36px; margin: auto 0;
    background: transparent; border: none; font-size: 20px; font-weight: bold;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #000;
  }
  .tool-btn:hover { background: #eee; border-radius: 50%; }
  .input-wrap.locked .tool-btn { color: #999; pointer-events: none; }
  
  .clearfix::after { content: ""; clear: both; display: table; }

  @keyframes fadeIn { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }
</style>
</head>
<body>

<div class="modal">
  <div class="header">
    <div class="header-title">变量自动生成</div>
    <div class="header-close" onclick="alert('弹窗关闭')">✕</div>
  </div>

  <div class="chat-body" id="chatBody">
    <!-- 初始欢迎语（可选） -->
  </div>

  <div class="footer">
    <div class="hints">每次对话消耗 50 积分</div>
    <div class="input-files" id="inputFiles"></div>
    <div class="input-wrap" id="inputWrap">
      <input type="text" class="input-box-control" id="userInput" placeholder="请输入需求描述，或者上传带有点表信息的文件" autocomplete="off" onkeydown="if(event.key==='Enter') doSend()">
      <button class="tool-btn" title="上传附件" onclick="attachFile()">⊕</button>
      <button class="tool-btn" title="发送" onclick="doSend()">↑</button>
    </div>
  </div>
</div>

<script>
  const chatBody = document.getElementById('chatBody');
  const userInput = document.getElementById('userInput');
  const inputFiles = document.getElementById('inputFiles');
  const inputWrap = document.getElementById('inputWrap');
  
  let step = 0;
  let hasFile = false;

  function scrollToBottom() {
    setTimeout(() => { chatBody.scrollTop = chatBody.scrollHeight; }, 50);
  }

  // 统一渲染气泡的方法
  function addMessage(isAI, contentHTML) {
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg ' + (isAI ? 'ai' : 'user');
    msgDiv.innerHTML = `<div class="bubble">${contentHTML}</div>`;
    chatBody.appendChild(msgDiv);
    scrollToBottom();
  }

  // 1. 挂载文件
  function attachFile() {
    if (hasFile || step !== 0) return;
    hasFile = true;
    inputFiles.innerHTML = `
      <div class="input-file-tag">SIOT_S7变量5W.xlsx <i onclick="removeFile()">✕</i></div>
      <div class="input-file-tag">SIOT_建信ADS变量... <i onclick="removeFile()">✕</i></div>
    `;
    userInput.placeholder = "可补充描述说明，然后点击 ↑ 发送";
    userInput.focus();
  }

  function removeFile() {
    hasFile = false;
    inputFiles.innerHTML = '';
    userInput.placeholder = "请输入需求描述，或者上传带有点表信息的文件";
  }

  // 2. 发送逻辑
  function doSend() {
    const text = userInput.value.trim();
    if (step === 0 && hasFile) {
      // 第一条消息：用户输入的内容和上传的文件
      let userHtml = `
        <div class="ai-files-row" style="margin-bottom: 8px;">
          <div class="ai-file-tag" style="background:#444; color:#fff; border-color:#fff;"><span class="ai-file-tag-icon" style="border-color:#fff;"></span> SIOT_S7变量5W.xlsx</div>
          <div class="ai-file-tag" style="background:#444; color:#fff; border-color:#fff;"><span class="ai-file-tag-icon" style="border-color:#fff;"></span> SIOT_建信ADS变量...</div>
        </div>
      `;
      if (text) userHtml += `<div>${text}</div>`;
      
      addMessage(false, userHtml);
      
      removeFile();
      userInput.value = '';
      step = 1;
      lockInput('内容解析排布中...');
      
      // 添加一个极短延迟来表现出先后顺序，然后展现 AI 解析气泡
      setTimeout(() => {
        startPreliminaryParsing();
      }, 500);
      return;
    }
    
    if (text) {
      addMessage(false, text);
      userInput.value = '';
      
      if (step === 0) {
        step = 1;
        lockInput('意图解析与规划中...');
        setTimeout(() => {
          startPreliminaryParsing();
        }, 500);
      } else {
        setTimeout(() => {
          addMessage(true, "收悉。请根据系统提示的流程操作。");
        }, 500);
      }
    }
  }

  // 第二条消息：AI 开始解析的过程
  function startPreliminaryParsing() {
    const aiHtml = `
      <div class="placeholder-box" style="margin-top: 0;">
        <div class="placeholder-title">解析过程输出 (线框占位)</div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" id="prog1"></div></div>
          <div class="progress-label" id="progLabel1">解析进度：0.0%</div>
        </div>
      </div>
    `;
    addMessage(true, aiHtml);
    
    let p = 0;
    let timer = setInterval(() => {
      p += 14.5;
      if (p >= 100) { p = 100; clearInterval(timer); showChannelResult(); }
      document.getElementById('prog1').style.width = p + '%';
      document.getElementById('progLabel1').innerText = '解析进度：' + p.toFixed(1) + '%';
    }, 400);
  }

  // 通道结果与确认态
  function showChannelResult() {
    unlockInput();
    step = 2;
    const aiHtml = `
      <div class="ai-desc-block">
        <div style="font-weight:bold; margin-bottom:12px;">解析结果</div>
        <div style="margin-bottom:8px;">文件中已为您解析出以下变量及大部分可匹配的结构数据。</div>
        <div>☑ 提取到预处理变量：<span>14,082 个变量</span></div>
      </div>
      
      <div class="channel-row">
        <div style="width: 50px;">通道 1</div>
        <div class="channel-name">1# 泵站监控系统</div>
        <div>变量数：1202</div>
      </div>
      <div class="channel-row">
        <div style="width: 50px;">通道 2</div>
        <div class="channel-name">2# 泵站监控系统</div>
        <div>变量数：1202</div>
      </div>
      <div class="channel-row">
        <div style="width: 50px;">通道 3</div>
        <div class="channel-name">3# 泵站监控系统</div>
        <div>变量数：1002</div>
      </div>
      
      <div class="clearfix">
        <button class="btn" id="btnDeep" onclick="startDeepParsing()">确认并开始深度解析</button>
      </div>
    `;
    addMessage(true, aiHtml);
  }

  // 深度解析态
  function startDeepParsing() {
    step = 3;
    document.getElementById('btnDeep').disabled = true;
    
    // 模拟扣费
    addMessage(false, "确认并开始深度解析");
    lockInput('深度解析中...');
    
    const aiHtml = `
      <div class="placeholder-box">
        <div class="placeholder-title">深度解析过程的输出</div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" id="prog2"></div></div>
          <div class="progress-label" id="progLabel2">解析进度：0.0%</div>
        </div>
      </div>
    `;
    addMessage(true, aiHtml);
    
    let p = 0;
    let timer = setInterval(() => {
      p += 18.2;
      if (p >= 100) { p = 100; clearInterval(timer); showFinalResult(); }
      document.getElementById('prog2').style.width = p + '%';
      document.getElementById('progLabel2').innerText = '解析进度：' + p.toFixed(1) + '%';
    }, 400);
  }

  // 最终结果
  function showFinalResult() {
    unlockInput();
    step = 4;
    const aiHtml = `
      <div class="ai-desc-block">
        解析完成，解析通道数 <strong>3</strong>，变量数 <strong>12388</strong>。<br>请选择导入方式将变量写入变量管理。
      </div>
      <div class="clearfix">
        <button class="btn" onclick="alert('🎉 写入逻辑触发！系统扣除 50 积分并保存变量。')">变量写入</button>
      </div>
    `;
    addMessage(true, aiHtml);
  }

  // 锁定与解锁输入框
  function lockInput(text) {
    userInput.disabled = true;
    userInput.placeholder = text;
    inputWrap.classList.add('locked');
  }
  function unlockInput() {
    userInput.disabled = false;
    userInput.placeholder = "请输入需求描述，或者上传带有点表信息的文件";
    inputWrap.classList.remove('locked');
  }
</script>
</body>
</html>
